# Format, lint and test on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/icon/src/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/icon/src/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: faster builds and a much smaller cache to save and restore.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: fmt, clippy, test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Keeps a release-profile cache of the dependencies for the release workflow (a tag run can
  # restore caches saved on main, not the other way round). Runs in parallel with `check`.
  release-cache:
    name: release build cache (Windows x64)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x64

      - name: Release build
        run: cargo build --release

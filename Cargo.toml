[workspace]
resolver = "3"
members = ["crates/protocol", "crates/settings"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
kuality-protocol = { path = "crates/protocol" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/settings"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
kuality-protocol = { path = "crates/protocol" }
kuality-settings = { path = "crates/settings" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Size-optimized release build (docs/specs/distribution.md). `panic` stays "unwind": the keyboard
# hook uses `catch_unwind` to release the Hyper modifiers and keep running after a panic.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
debug = false
